<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKU RADIO</title>
<meta name="description" content="KUKU RADIO — a private radio station, tuned just for us. Tune a frequency and let it play.">
<meta name="theme-color" content="#170812">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KUKU RADIO">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="rose">

<div id="station-background" aria-hidden="true">
  <div class="station-bg-layer" id="station-bg-a"></div>
  <div class="station-bg-layer" id="station-bg-b"></div>
  <div class="station-bg-overlay"></div>
  <div class="station-bg-error" id="station-bg-error">
    Background image could not be loaded.
  </div>
</div>

<div id="sky"></div>

<nav class="quick-links" aria-label="Music and KUKU RADIO links">
  <a class="quick-link" href="https://music.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube Music">
    <img class="quick-icon-img" src="icons/youtube-music.svg" alt="" loading="lazy" onerror="this.outerHTML='&lt;span class=&quot;quick-icon-fallback&quot;&gt;&#9654;&lt;/span&gt;'"><span class="label">YouTube Music</span>
  </a>
  <a class="quick-link" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Spotify">
    <img class="quick-icon-img" src="icons/spotify.svg" alt="" loading="lazy" onerror="this.outerHTML='&lt;span class=&quot;quick-icon-fallback&quot;&gt;&#9679;&lt;/span&gt;'"><span class="label">Spotify</span>
  </a>
  <a class="quick-link" href="https://www.jiosaavn.com/" target="_blank" rel="noopener noreferrer" aria-label="Open JioSaavn">
    <img class="quick-icon-img" src="icons/jiosaavn.svg" alt="" loading="lazy" onerror="this.outerHTML='&lt;span class=&quot;quick-icon-fallback&quot;&gt;&#9834;&lt;/span&gt;'"><span class="label">JioSaavn</span>
  </a>
  <a class="quick-link" id="song-request-link" href="#" aria-label="Request a new song on WhatsApp">
    <img class="quick-icon-img" src="icons/whatsapp.svg" alt="" loading="lazy" onerror="this.outerHTML='&lt;span class=&quot;quick-icon-fallback&quot;&gt;&#9742;&lt;/span&gt;'"><span class="label">Request Song</span>
  </a>
  <button class="quick-link install-button" id="install-app-button" type="button" aria-label="Install KUKU RADIO" hidden>
    <span class="quick-icon-fallback" aria-hidden="true">＋</span><span class="label">Install App</span>
  </button>
</nav>
<div class="install-hint" id="install-hint" hidden></div>

<main>

  <div class="station-id">
    <div class="status-row">
      <div class="on-air"><span class="on-air-dot"></span> On air</div>
      <div class="live-count" aria-live="off">
        <span class="live-dot" aria-hidden="true"></span><span id="live-count-number">--</span>&nbsp;listening&nbsp;now
      </div>
    </div>
    <h1 class="wordmark">KUKU RADIO</h1>
    <p class="tagline">on air, just for us</p>
  </div>

  <div class="dial-console" id="dial-console">
    <svg id="dial-svg" viewBox="0 0 400 225" aria-hidden="true">
      <defs>
        <radialGradient id="veilGradient" cx="50%" cy="90%" r="70%">
          <stop id="veil-stop-1" offset="0%" stop-color="#170812" stop-opacity="0.9"/>
          <stop id="veil-stop-2" offset="100%" stop-color="#170812" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path class="dial-arc" d="M 55.1 171.2 A 150 150 0 0 1 344.9 171.2"></path>
      <g id="ticks-group"></g>
      <rect class="dial-veil" x="0" y="0" width="400" height="225"></rect>
      <g id="needle-group">
        <line class="needle" x1="200" y1="210" x2="200" y2="72"></line>
        <circle class="needle-hub" cx="200" cy="210" r="6"></circle>
      </g>
    </svg>
  </div>

  <div class="frequency-row" id="frequency-row"></div>

  <section class="now-playing" aria-label="Now playing">
    <div class="track-meta">
      <div class="track-meta-text">
        <div class="freq-label" id="np-freq-label">88.1 · Late Night 90s</div>
        <div class="track-title empty" id="np-title">Tuning in…</div>
        <div class="track-subtitle" id="np-subtitle" hidden></div>
      </div>
      <div class="eq-bars" id="eq-bars"><span></span><span></span><span></span></div>
    </div>

    <div class="progress-row">
      <span class="time current" id="time-current">0:00</span>
      <div id="progress-bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <span class="time" id="time-duration">0:00</span>
    </div>

    <div class="transport">
      <button id="btn-prev" aria-label="Previous track" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="btn-play" aria-label="Play" disabled>
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="btn-next" aria-label="Next track" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--cream-faint)" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </section>

  <footer>&#8258; private frequency &#8258; &nbsp;·&nbsp; installable web app</footer>

</main>

<audio id="audio-player" preload="metadata"></audio>

<script type="module" src="js/app.js"></script>
</body>
</html>
