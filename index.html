<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUKU RADIO</title>
<meta name="theme-color" content="#170812">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KUKU RADIO">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* KUKU RADIO — dynamic per-station themes. JS sets body[data-theme] on station
       change; :root holds the default (Late Night 90s / rose) shown before JS runs. */
    --bg-deep: #170812;
    --bg-deep-rgb: 23, 8, 18;
    --bg-violet: #3d0f30;
    --bg-violet-2: #5c1442;
    --glow-amber: #ff3f6c;
    --glow-amber-rgb: 255, 63, 108;
    --glow-amber-dim: rgba(255, 63, 108, 0.35);
    --blush-rose: #ff8a3d;
    --blush-rose-rgb: 255, 138, 61;
    --soft-lavender: #ffcf5c;
    --cream: #fff6f0;
    --cream-rgb: 255, 246, 240;
    --cream-dim: rgba(255, 246, 240, 0.66);
    --cream-faint: rgba(255, 246, 240, 0.36);
    --glass-bg: rgba(255, 246, 240, 0.06);
    --glass-border: rgba(255, 158, 180, 0.18);
    --shadow-deep: rgba(20, 3, 12, 0.55);
  }

  /* Station 1 — "Late Night 90s" — rose-red / coral-orange / gold */
  body[data-theme="rose"] {
    --bg-deep: #170812;
    --bg-deep-rgb: 23, 8, 18;
    --bg-violet: #3d0f30;
    --bg-violet-2: #5c1442;
    --glow-amber: #ff3f6c;
    --glow-amber-rgb: 255, 63, 108;
    --glow-amber-dim: rgba(255, 63, 108, 0.35);
    --blush-rose: #ff8a3d;
    --blush-rose-rgb: 255, 138, 61;
    --soft-lavender: #ffcf5c;
    --cream: #fff6f0;
    --cream-rgb: 255, 246, 240;
    --cream-dim: rgba(255, 246, 240, 0.66);
    --cream-faint: rgba(255, 246, 240, 0.36);
    --glass-bg: rgba(255, 246, 240, 0.06);
    --glass-border: rgba(255, 158, 180, 0.18);
    --shadow-deep: rgba(20, 3, 12, 0.55);
  }

  /* Station 2 — "Missing You" — the original amber / dark-violet theme */
  body[data-theme="original"] {
    --bg-deep: #0a141f;
    --bg-deep-rgb: 10, 20, 31;
    --bg-violet: #13293d;
    --bg-violet-2: #1e415c;
    --glow-amber: #4fc3f7;
    --glow-amber-rgb: 79, 195, 247;
    --glow-amber-dim: rgba(79, 195, 247, 0.35);
    --blush-rose: #cfeaf7;
    --blush-rose-rgb: 207, 234, 247;
    --soft-lavender: #9fb9c9;
    --cream: #f4f9fb;
    --cream-rgb: 244, 249, 251;
    --cream-dim: rgba(244, 249, 251, 0.66);
    --cream-faint: rgba(244, 249, 251, 0.36);
    --glass-bg: rgba(244, 249, 251, 0.06);
    --glass-border: rgba(180, 210, 225, 0.18);
    --shadow-deep: rgba(3, 8, 14, 0.55);
  }

  /* Station 3 — "Bhojpuri Melody" — sky-blue / white-gray */
  body[data-theme="sky"] {
    --bg-deep: #160b24;
    --bg-deep-rgb: 22, 11, 36;
    --bg-violet: #3a124f;
    --bg-violet-2: #671b70;
    --glow-amber: #ff4fd8;
    --glow-amber-rgb: 255, 79, 216;
    --glow-amber-dim: rgba(255, 79, 216, 0.38);
    --blush-rose: #8cff4f;
    --blush-rose-rgb: 140, 255, 79;
    --soft-lavender: #e2b7ff;
    --cream: #fff5ff;
    --cream-rgb: 255, 245, 255;
    --cream-dim: rgba(255, 245, 255, 0.68);
    --cream-faint: rgba(255, 245, 255, 0.38);
    --glass-bg: rgba(255, 245, 255, 0.075);
    --glass-border: rgba(255, 79, 216, 0.24);
    --shadow-deep: rgba(13, 3, 20, 0.58);
  }

  /* Station 5 — Punjabi Funk: electric purple / magenta / lime */
  body[data-theme="funky"] {
    --bg-deep: #0f0e1a;
    --bg-deep-rgb: 15, 14, 26;
    --bg-violet: #241f42;
    --bg-violet-2: #2e2555;
    --glow-amber: #f2b166;
    --glow-amber-rgb: 242, 177, 102;
    --glow-amber-dim: rgba(242, 177, 102, 0.35);
    --blush-rose: #e8879a;
    --blush-rose-rgb: 232, 135, 154;
    --soft-lavender: #c9b6e4;
    --cream: #f7ede0;
    --cream-rgb: 247, 237, 224;
    --cream-dim: rgba(247, 237, 224, 0.62);
    --cream-faint: rgba(247, 237, 224, 0.34);
    --glass-bg: rgba(247, 237, 224, 0.055);
    --glass-border: rgba(247, 237, 224, 0.13);
    --shadow-deep: rgba(5, 4, 12, 0.55);
  }

  /* Station 6 — Party Vibes: electric teal / coral / gold, festive nightlife */
  body[data-theme="party"] {
    --bg-deep: #051a1c;
    --bg-deep-rgb: 5, 26, 28;
    --bg-violet: #0d3438;
    --bg-violet-2: #124a4f;
    --glow-amber: #2dd4bf;
    --glow-amber-rgb: 45, 212, 191;
    --glow-amber-dim: rgba(45, 212, 191, 0.36);
    --blush-rose: #ff6b6b;
    --blush-rose-rgb: 255, 107, 107;
    --soft-lavender: #ffc857;
    --cream: #f0fffd;
    --cream-rgb: 240, 255, 253;
    --cream-dim: rgba(240, 255, 253, 0.68);
    --cream-faint: rgba(240, 255, 253, 0.38);
    --glass-bg: rgba(240, 255, 253, 0.075);
    --glass-border: rgba(120, 230, 220, 0.22);
    --shadow-deep: rgba(2, 12, 13, 0.58);
  }

  /* Station 4 — "Slow move" — brown / gray / white */
  body[data-theme="brown"] {
    --bg-deep: #150f0c;
    --bg-deep-rgb: 21, 15, 12;
    --bg-violet: #2c1f17;
    --bg-violet-2: #40291b;
    --glow-amber: #cf9a5c;
    --glow-amber-rgb: 207, 154, 92;
    --glow-amber-dim: rgba(207, 154, 92, 0.35);
    --blush-rose: #b7a68f;
    --blush-rose-rgb: 183, 166, 143;
    --soft-lavender: #9c8f80;
    --cream: #f4efe7;
    --cream-rgb: 244, 239, 231;
    --cream-dim: rgba(244, 239, 231, 0.66);
    --cream-faint: rgba(244, 239, 231, 0.36);
    --glass-bg: rgba(244, 239, 231, 0.06);
    --glass-border: rgba(205, 188, 168, 0.18);
    --shadow-deep: rgba(10, 6, 4, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, var(--bg-violet-2) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 15%, rgba(var(--blush-rose-rgb), 0.14) 0%, transparent 55%),
      radial-gradient(ellipse 60% 40% at 8% 96%, rgba(var(--glow-amber-rgb), 0.12) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-violet) 55%, var(--bg-deep) 100%);
    color: var(--cream);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
    touch-action: pan-y;
    transition: background 0.9s ease, color 0.9s ease;
  }

  /* ---------- Full-page station background ---------- */
  #station-background {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    background: var(--bg-deep);
    transition: background 0.9s ease;
  }

  .station-bg-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    opacity: 0;
    transform: scale(1.07);
    transition: opacity 2.6s cubic-bezier(0.45, 0, 0.2, 1), transform 10s cubic-bezier(0.25, 0.1, 0.25, 1);
    will-change: opacity, transform;
  }

  .station-bg-layer.active {
    opacity: 1;
    transform: scale(1);
  }

  .station-bg-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        rgba(var(--bg-deep-rgb), 0.44) 0%,
        rgba(var(--bg-deep-rgb), 0.24) 40%,
        rgba(var(--bg-deep-rgb), 0.60) 100%),
      radial-gradient(circle at 50% 35%,
        rgba(var(--bg-deep-rgb), 0.05) 0%,
        rgba(var(--bg-deep-rgb), 0.44) 100%);
    transition: background 0.9s ease;
  }

  /* Stars stay above the background but below the UI. */
  #sky {
    z-index: 2;
  }

  main {
    z-index: 3;
  }

  .station-bg-error {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 3;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: var(--cream-dim);
    font: 0.7rem 'Space Mono', monospace;
    pointer-events: none;
    display: none;
  }

  /* ---------- Ambient sky / particles ---------- */
  #sky {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--cream);
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.85); }
    50% { opacity: 0.85; transform: scale(1.1); }
  }

  /* ---------- Layout ---------- */
  main {
    position: relative;
    z-index: 1;
    max-width: 620px;
    margin: 0 auto;
    padding: 3.2rem 1.4rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Header / station ID ---------- */
  .station-id {
    text-align: center;
    margin-bottom: 1.6rem;
  }

  .on-air {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: var(--glow-amber);
    text-transform: uppercase;
    margin-bottom: 1rem;
    opacity: 0.9;
    transition: color 0.9s ease;
  }

  .on-air-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--glow-amber);
    box-shadow: 0 0 8px 2px var(--glow-amber-dim);
    animation: pulse-dot 2.4s ease-in-out infinite;
    transition: background 0.9s ease, box-shadow 0.9s ease;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1.wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 9vw, 3.6rem);
    letter-spacing: 0.01em;
    line-height: 1;
    background: linear-gradient(180deg, var(--cream) 8%, var(--glow-amber) 78%, var(--blush-rose) 150%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: background 0.9s ease;
  }

  .tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.02rem;
    color: var(--cream-dim);
    margin-top: 0.5rem;
    letter-spacing: 0.01em;
    transition: color 0.9s ease;
  }

  /* ---------- Dial console ---------- */
  .dial-console {
    width: 100%;
    max-width: 420px;
    margin: 1.8rem 0 0.6rem;
  }

  #dial-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  .dial-arc {
    fill: none;
    stroke: var(--glass-border);
    stroke-width: 1.5;
    transition: stroke 0.9s ease;
  }

  .tick-minor {
    stroke: var(--cream-faint);
    stroke-width: 1;
    transition: stroke 0.9s ease;
  }

  .tick-major {
    stroke: var(--cream-dim);
    stroke-width: 1.5;
    transition: stroke 0.9s ease;
  }

  .tick-label {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    fill: var(--cream-dim);
    text-anchor: middle;
    transition: fill 0.9s ease;
  }

  .tick-label.active {
    fill: var(--glow-amber);
  }

  #needle-group {
    transform-origin: 200px 210px;
    transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .needle {
    stroke: var(--glow-amber);
    stroke-width: 2.5;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px var(--glow-amber-dim));
    transition: stroke 0.9s ease, filter 0.9s ease;
  }

  .needle-hub {
    fill: var(--glow-amber);
    filter: drop-shadow(0 0 6px var(--glow-amber-dim));
    transition: fill 0.9s ease, filter 0.9s ease;
  }

  .dial-veil {
    fill: url(#veilGradient);
    opacity: 0;
    transition: opacity 0.9s ease;
    pointer-events: none;
  }

  .dial-console.tuning .dial-veil {
    opacity: 1;
  }

  #veil-stop-1, #veil-stop-2 {
    stop-color: var(--bg-deep);
    transition: stop-color 0.9s ease;
  }

  /* ---------- Frequency buttons ---------- */
  .frequency-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.55rem;
    margin: 1.4rem 0 2rem;
    width: 100%;
  }

  .freq-btn {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--cream-dim);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }

  .freq-btn .num {
    font-family: 'Space Mono', monospace;
    color: var(--soft-lavender);
    font-size: 0.9rem;
    font-weight: 700;
    transition: color 0.4s ease;
  }

  .freq-btn:hover {
    border-color: var(--glow-amber-dim);
    color: var(--cream);
  }

  .freq-btn:focus-visible {
    outline: 2px solid var(--glow-amber);
    outline-offset: 2px;
  }

  .freq-btn.active {
    background: linear-gradient(135deg, rgba(var(--glow-amber-rgb), 0.22), rgba(var(--blush-rose-rgb), 0.14));
    border-color: var(--glow-amber-dim);
    color: var(--cream);
  }

  .freq-btn.active .num {
    color: var(--glow-amber);
  }

  /* ---------- Now playing card ---------- */
  .now-playing {
    width: 100%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 1.1rem 1.3rem 1rem;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 15px 45px var(--shadow-deep);
    transition: background 0.9s ease, border-color 0.9s ease, box-shadow 0.9s ease;
    position: sticky;
    top: 0.75rem;
    z-index: 5;
  }

  .track-meta {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.85rem;
  }

  .track-meta-text {
    min-width: 0;
  }

  .freq-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--glow-amber);
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 0.3rem;
    transition: color 0.9s ease;
  }

  .track-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.28rem;
    line-height: 1.22;
    color: var(--cream);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    transition: color 0.9s ease;
  }

  .track-title.empty {
    font-style: italic;
    color: var(--cream-dim);
    font-weight: 400;
  }

  .track-artist {
    font-size: 0.83rem;
    color: var(--cream-dim);
    margin-top: 0.2rem;
    transition: color 0.9s ease;
  }

  .eq-bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 0.3rem;
  }

  .eq-bars span {
    width: 3px;
    background: var(--glow-amber);
    border-radius: 2px;
    height: 4px;
    opacity: 0.5;
    animation: bar-bounce 1s ease-in-out infinite;
    animation-play-state: paused;
    transition: background 0.9s ease;
  }

  .eq-bars.playing span { opacity: 1; animation-play-state: running; }
  .eq-bars span:nth-child(1) { animation-delay: 0s; }
  .eq-bars span:nth-child(2) { animation-delay: 0.2s; }
  .eq-bars span:nth-child(3) { animation-delay: 0.35s; }

  @keyframes bar-bounce {
    0%, 100% { height: 4px; }
    50% { height: 16px; }
  }

  /* Progress bar */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.85rem;
  }

  .time {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--cream-faint);
    min-width: 34px;
    transition: color 0.9s ease;
  }

  .time.current { text-align: right; }

  #progress-bar {
    flex: 1;
    height: 5px;
    background: rgba(var(--cream-rgb), 0.12);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.9s ease;
  }

  #progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, var(--blush-rose), var(--glow-amber));
    border-radius: 10px;
    transition: background 0.9s ease;
  }

  #progress-bar::after {
    content: '';
    position: absolute;
    left: var(--knob-pos, 0%);
    top: 50%;
    width: 12px; height: 12px;
    background: var(--cream);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px var(--shadow-deep);
    opacity: 0;
    transition: opacity 0.2s, background 0.9s ease, box-shadow 0.9s ease;
  }

  #progress-bar:hover::after,
  #progress-bar:focus-visible::after {
    opacity: 1;
  }

  /* Transport */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }

  .transport button {
    background: none;
    border: none;
    color: var(--cream);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem;
    transition: transform 0.2s ease, color 0.9s ease;
  }

  .transport button:hover { color: var(--glow-amber); transform: scale(1.08); }
  .transport button:focus-visible { outline: 2px solid var(--glow-amber); outline-offset: 3px; border-radius: 50%; }
  .transport button:disabled { opacity: 0.3; cursor: not-allowed; }
  .transport button:disabled:hover { color: var(--cream); transform: none; }

  #btn-play {
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--glow-amber), var(--blush-rose));
    color: var(--bg-deep);
    box-shadow: 0 8px 26px var(--glow-amber-dim);
    transition: transform 0.2s ease, color 0.9s ease, background 0.9s ease, box-shadow 0.9s ease;
  }

  #btn-play:hover { color: var(--bg-deep); transform: scale(1.05); }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 0.9rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--glass-border);
    transition: border-color 0.9s ease;
  }

  #volume-slider {
    flex: 1;
    accent-color: var(--glow-amber);
    height: 4px;
    cursor: pointer;
  }

  /* ---------- Tracklist ---------- */
  .tracklist-section {
    width: 100%;
    margin-top: 1.8rem;
    padding-bottom: 8rem;
    position: relative;
    z-index: 4;
  }

  .tracklist-heading {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-bottom: 0.8rem;
    transition: color 0.9s ease;
  }

  #tracklist {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    width: 100%;
    min-height: 1px;
    overflow: visible;
  }

  #tracklist .empty-note {
    display: block;
    width: 100%;
    padding: .9rem 0 1.2rem;
    color: var(--cream-faint);
    font-size: .82rem;
    line-height: 1.55;
  }

  #tracklist li button {
    width: 100%;
    display: flex;

const SVG_NS = "http://www.w3.org/2000/svg";
const CX = 200, CY = 210, R_OUTER = 150, R_MINOR_IN = 145, R_MAJOR_IN = 130, R_LABEL = 113;
const ANGLE_START = 165, ANGLE_END = 15;

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function angleForIndex(i, total) {
  if (total === 1) return (ANGLE_START + ANGLE_END) / 2;
  const step = (ANGLE_START - ANGLE_END) / (total - 1);
  return ANGLE_START - step * i;
}

function polar(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
}

function buildDial() {
  let svg = '';
  // fine minor ticks for texture
  const minorCount = 23;
  for (let i = 0; i < minorCount; i++) {
    const a = ANGLE_START - (i * (ANGLE_START - ANGLE_END) / (minorCount - 1));
    const p1 = polar(CX, CY, R_MINOR_IN, a);
    const p2 = polar(CX, CY, R_OUTER, a);
    svg += `<line class="tick-minor" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"/>`;
  }
  // major ticks + numbers, one per station
  STATIONS.forEach((s, i) => {
    const a = angleForIndex(i, STATIONS.length);
    const p1 = polar(CX, CY, R_MAJOR_IN, a);
    const p2 = polar(CX, CY, R_OUTER, a);
    const lp = polar(CX, CY, R_LABEL, a);
    svg += `<line class="tick-major" data-idx="${i}" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"/>`;
    svg += `<text class="tick-label" data-idx="${i}" x="${lp.x.toFixed(1)}" y="${(lp.y + 4).toFixed(1)}">${s.freq}</text>`;
  });
  ticksGroup.innerHTML = svg;
}

function updateNeedle(index) {
  const a = angleForIndex(index, STATIONS.length);
  const rotation = 90 - a;
  needleGroup.style.transform = `rotate(${rotation}deg)`;
}

function updateDialLabels(activeIndex) {
  document.querySelectorAll('.tick-label').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.idx) === activeIndex);
  });
}

function buildFrequencyButtons() {
  freqRow.innerHTML = '';
  STATIONS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'freq-btn';
    btn.type = 'button';
    btn.innerHTML = `<span class="num">${s.freq}</span><span>${s.name}</span>`;
    btn.setAttribute('aria-label', `Tune to ${s.freq}, ${s.name}`);
    btn.addEventListener('click', () => goToStation(i, true));
    freqRow.appendChild(btn);
  });
}

function updateFrequencyActive(index) {
  [...freqRow.children].forEach((btn, i) => btn.classList.toggle('active', i === index));
}

function formatTime(sec) {
  if (!isFinite(sec) || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function renderTracklist() {
  const station = STATIONS[currentStation];
  tracklistEl.replaceChildren();

  // Keep the heading useful even when the station has no songs.
  const heading = document.querySelector('.tracklist-heading');
  if (heading) {
    heading.textContent = `On this frequency · ${station.tracks.length} songs`;
  }

  if (!Array.isArray(station.tracks) || station.tracks.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent =
      `Nothing queued on ${station.freq} yet — add an mp3 to the audio folder and list it in the station config.`;
    tracklistEl.appendChild(p);
    return;
  }

  const fragment = document.createDocumentFragment();

  station.tracks.forEach((t, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    const index = document.createElement('span');
    const textWrap = document.createElement('span');
    const title = document.createElement('span');
    const artist = document.createElement('span');

    btn.type = 'button';
    btn.className = i === currentTrack ? 'active' : '';
    btn.setAttribute('aria-label', `Play ${t.title}`);

    index.className = 'track-index';
    index.textContent = String(i + 1).padStart(2, '0');

    title.textContent = t.title || 'Untitled';
    artist.className = 'track-row-artist';
    artist.textContent = t.artist || '';

    textWrap.append(title, artist);
    btn.append(index, textWrap);

    btn.addEventListener('click', () => {
      currentTrack = i;
      loadCurrentTrack();
      renderTracklist();
      playAudio();
    });

    li.appendChild(btn);
    fragment.appendChild(li);
  });

  tracklistEl.appendChild(fragment);
}

function loadCurrentTrack() {
  const station = STATIONS[currentStation];
  npFreqLabel.textContent = `${station.freq} · ${station.name}`;

  if (station.tracks.length === 0) {
    audio.removeAttribute('src');
    npTitle.textContent = "This frequency's still quiet";
    npTitle.classList.add('empty');
    npArtist.textContent = "Add a track to start the broadcast";
    setControlsEnabled(false);
    updateProgressUI(0, 0);
    return;
  }

  const track = station.tracks[currentTrack];
  // encodeURI preserves the folder structure while safely handling spaces
  // and common characters in uploaded MP3 filenames.
  audio.src = encodeURI(track.file);
  npTitle.textContent = track.title;
  npTitle.classList.remove('empty');
  npArtist.textContent = track.artist || '';
  setControlsEnabled(true);
}

function setControlsEnabled(enabled) {
  btnPlay.disabled = !enabled;
  btnPrev.disabled = !enabled || STATIONS[currentStation].tracks.length < 2;
  btnNext.disabled = !enabled || STATIONS[currentStation].tracks.length < 2;
}


function clearStationBackground() {
  bgRunId++;
  if (bgTimer) {
    clearInterval(bgTimer);
    bgTimer = null;
  }

  bgIndex = 0;
  bgShowingA = true;

  stationBgA.classList.remove('active');
  stationBgB.classList.remove('active');
  stationBgA.style.backgroundImage = '';
  stationBgB.style.backgroundImage = '';

  stationBgError.style.display = 'none';
}

function preloadImage(src) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => resolve(src);

    img.onerror = () => {
      console.error('[KUKU RADIO] Background image failed:', src);
      resolve(null);
    };

    img.src = src;
  });
}

async function startStationBackground(station) {
  clearStationBackground();

  const images = Array.isArray(station.backgroundImages)
    ? station.backgroundImages.filter(Boolean)
    : [];

  if (!images.length) return;

  const runId = bgRunId;

  // Preload all images first so the animation never flashes a broken image.
  const loaded = (await Promise.all(images.map(preloadImage))).filter(Boolean);

  if (runId !== bgRunId) return;

  if (!loaded.length) {
    stationBgError.textContent =
      'Missing You background not found. Check picture/ filenames.';
    stationBgError.style.display = 'block';
    return;
  }

  // First image appears immediately.
  bgIndex = 0;
  bgShowingA = true;
  stationBgA.style.backgroundImage = `url("${loaded[0]}")`;
  stationBgA.classList.add('active');

  if (loaded.length === 1) return;

  bgTimer = setInterval(() => {
    bgIndex = (bgIndex + 1) % loaded.length;

    const incoming = bgShowingA ? stationBgB : stationBgA;
    const outgoing = bgShowingA ? stationBgA : stationBgB;

    incoming.style.backgroundImage = `url("${loaded[bgIndex]}")`;

    // Force the browser to register the new background before the fade.
    void incoming.offsetWidth;

    incoming.classList.add('active');
    outgoing.classList.remove('active');

    bgShowingA = !bgShowingA;
  }, BG_INTERVAL);
}

function applyStationTheme(index) {
  const theme = STATIONS[index] && STATIONS[index].theme ? STATIONS[index].theme : 'rose';
  document.body.setAttribute('data-theme', theme);
}

function goToStation(index, autoplay) {
  pauseAudio();
  applyStationTheme(index);
  currentStation = index;
  currentTrack = 0;
  updateNeedle(index);
  updateDialLabels(index);
  updateFrequencyActive(index);
  loadCurrentTrack();
  renderTracklist();
  startStationBackground(STATIONS[index]);
  if (autoplay && STATIONS[index].tracks.length > 0) {
    playAudio();
  }
}

function playAudio() {
  if (STATIONS[currentStation].tracks.length === 0) return;
  audio.play().catch(() => {});
  isPlaying = true;
  updatePlayUI();
}

function pauseAudio() {
  audio.pause();
  isPlaying = false;
  updatePlayUI();
}

function togglePlay() {
  isPlaying ? pauseAudio() : playAudio();
}

function updatePlayUI() {
  playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  btnPlay.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  eqBars.classList.toggle('playing', isPlaying);
}

function nextTrack() {
  const station = STATIONS[currentStation];
  if (station.tracks.length === 0) return;
  currentTrack = (currentTrack + 1) % station.tracks.length;
  loadCurrentTrack();
  renderTracklist();
  playAudio();
}

function prevTrack() {
  const station = STATIONS[currentStation];
  if (station.tracks.length === 0) return;
  currentTrack = (currentTrack - 1 + station.tracks.length) % station.tracks.length;
  loadCurrentTrack();
  renderTracklist();
  playAudio();
}

function updateProgressUI(current, duration) {
  const pct = duration ? (current / duration) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressBar.style.setProperty('--knob-pos', pct + '%');
  progressBar.setAttribute('aria-valuenow', Math.round(pct));
  timeCurrent.textContent = formatTime(current);
  timeDuration.textContent = formatTime(duration);
}

audio.addEventListener('timeupdate', () => updateProgressUI(audio.currentTime, audio.duration));
audio.addEventListener('loadedmetadata', () => updateProgressUI(audio.currentTime, audio.duration));
audio.addEventListener('ended', nextTrack);

audio.addEventListener('error', () => {
  const station = STATIONS[currentStation];
  const track = station?.tracks?.[currentTrack];
  if (!track) return;

  console.warn('[KUKU RADIO] Audio could not be loaded:', track.file);

  // The playlist stays visible even if an individual MP3 is missing.
  npArtist.textContent = 'Audio file unavailable — check the exact filename in /audio/';
  isPlaying = false;
  updatePlayUI();
});


progressBar.addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  audio.currentTime = pct * audio.duration;
});

progressBar.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
  if (e.key === 'ArrowLeft') audio.currentTime = Math.max(audio.currentTime - 5, 0);
});

btnPlay.addEventListener('click', togglePlay);
btnNext.addEventListener('click', nextTrack);
btnPrev.addEventListener('click', prevTrack);
volumeSlider.addEventListener('input', (e) => { audio.volume = parseFloat(e.target.value); });

function buildSky() {
  const sky = document.getElementById('sky');
  const count = prefersReducedMotion ? 18 : 34;
  let html = '';
  for (let i = 0; i < count; i++) {
    const size = (Math.random() * 2 + 1).toFixed(1);
    const left = (Math.random() * 100).toFixed(2);
    const top = (Math.random() * 100).toFixed(2);
    const dur = (Math.random() * 3 + 2.5).toFixed(1);
    const delay = (Math.random() * 4).toFixed(1);
    html += `<div class="star" style="width:${size}px;height:${size}px;left:${left}%;top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
  }
  sky.innerHTML = html;
}

function tuneIn() {
  audio.volume = parseFloat(volumeSlider.value);
  buildDial();
  buildFrequencyButtons();

  if (!prefersReducedMotion) {
    needleGroup.style.transition = 'none';
    updateNeedle(STATIONS.length - 1);
    dialConsole.classList.add('tuning');
    // force reflow so the transition below is picked up
    void needleGroup.offsetWidth;
    needleGroup.style.transition = '';
    setTimeout(() => {
      goToStation(0, false);
      setTimeout(() => dialConsole.classList.remove('tuning'), 500);
    }, 250);
  } else {
    goToStation(0, false);
  }
}


/* ---------- Quick links / PWA install ---------- */
const requestSongLink = document.getElementById('song-request-link');
const installAppButton = document.getElementById('install-app-button');
const installHint = document.getElementById('install-hint');

const WHATSAPP_NUMBER = "919942933699"; // 91 + the number exactly as given — please verify this opens the right chat (see note below)

const REQUEST_MESSAGE =
  "Hi KUKU RADIO 👋\n\nI want to request a song.\n\nSong name: \nStation / Playlist: \n\nPlease add it if possible. 🎵";

requestSongLink.href =
  "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(REQUEST_MESSAGE);

let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installAppButton.hidden = false;
});

installAppButton.addEventListener('click', async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installAppButton.hidden = true;
    return;
  }

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    installHint.textContent = "KUKU RADIO is already installed on this device.";
  } else if (isIOS) {
    installHint.textContent =
      "On iPhone/iPad: tap Share → Add to Home Screen.";
  } else {
    installHint.textContent =
      "On Android Chrome: open the browser menu (⋮) → Install app / Add to Home screen.";
  }

  installHint.hidden = false;
  setTimeout(() => { installHint.hidden = true; }, 6500);
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  installAppButton.hidden = true;
});

/* Register the service worker for the installable Android/PWA version. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.warn('[KUKU RADIO] Service worker registration failed:', error);
    });
  });
}


tuneIn();
buildSky();
</script>
